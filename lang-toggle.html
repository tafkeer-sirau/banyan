<!DOCTYPE html>
<HTML>
<HEAD>
<title>Lang</title>
<style>
  #eng { display: block; }
  #hin { display: none; }
</style>
</HEAD>
<BODY>

<button id="langBtn" onclick="toggleLang()">हिन्दी</button>

<span id="eng">
  <p>ENGLISH</p>
</span>
<span id="hin">
  <p>हिन्दी</p>
</span>

<script>
  function toggleLang() {
    var eng = document.getElementById("eng");
    var hin = document.getElementById("hin");
    var btn = document.getElementById("langBtn");

    if (eng.style.display === "none") {
      eng.style.display = "block";
      hin.style.display = "none";
      btn.textContent = "हिन्दी";
    } else {
      eng.style.display = "none";
      hin.style.display = "block";
      btn.textContent = "English";
    }
  }
</script>

</BODY>
</HTML>
